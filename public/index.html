<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>  <h1>Welcome to PockGame</h1></header>
    <main>
        <div class="result-container">
         
            <div id="user-selected-card"></div>
            <div class="result-user">
                <h3>Usuario</h3>
                <p>Vidas: <span id="user-lives">3</span></p>
                <p>Victorias: <span id="user-wins">0</span></p>
                <p>Perdidas: <span id="user-losses">0</span></p>
            </div>
            <div class="result-rival">
                <h3>Rival</h3>
                <p>Vidas: <span id="rival-lives">3</span></p>
                <p>Victorias: <span id="rival-wins">0</span></p>
                <p>Perdidas: <span id="rival-losses">0</span></p>
            </div>
            <div id="rival-selected-card"></div>
        </div>
       
   
        <div class="selected-cards-container" style="display: flex; justify-content: center; gap: 48px; margin: 32px 0;">
           
         
        </div>
        <div class="card-options">
            <div class="card">
                <img src="https://res.cloudinary.com/dspprxtpr/image/upload/v1755622739/dragpm_mg8kps.gif" alt="Shenron">
                <h2>Shenron</h2>
            </div>
            <div class="card">
                <img src="https://res.cloudinary.com/dspprxtpr/image/upload/v1755622592/maes_l4ijpt.gif" alt="Maestro Roshi">
                <h2>Maestro Roshi</h2>
            </div>
            <div class="card">
                <img src="https://res.cloudinary.com/dspprxtpr/image/upload/v1755622688/bill_dqdpqw.gif" alt="Bills">
                <h2>Bills</h2>
            </div>
            <div class="card">
                <img src="https://res.cloudinary.com/dspprxtpr/image/upload/v1755622400/Piccolo_nkvkvt.gif" alt="Piccolo">
                <h2>Piccolo</h2>
            </div>
            <div class="card">
                <img src="https://res.cloudinary.com/dspprxtpr/image/upload/v1755622303/veget_qg0bjg.gif" alt="Vegeta">
                <h2>Vegeta</h2>
            </div>
        </div>
    </main>
    <footer>
        <p>&copy; 2025 My Website</p>
    </footer>
    <script type="module" src="scripts/main.js"></script>
    
</body>
</html>
